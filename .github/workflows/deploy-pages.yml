name: Validate, build and deploy TripOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Stamp deployment version
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const sha = process.env.BUILD_SHA
          fs.writeFileSync('public/version.json', JSON.stringify({ version: sha, builtAt: new Date().toISOString() }))
          const swPath = 'public/sw.js'
          const sw = fs.readFileSync(swPath, 'utf8').replaceAll('__TRIPOS_BUILD_SHA__', sha)
          fs.writeFileSync(swPath, sw)
          NODE
      - name: Validate canonical trip data
        run: npm run validate:data
      - name: Build production PWA
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
